# Static export (`output: "export"` in next.config.mjs) → deploy the `out/` directory.
# https://nextjs.org/docs/app/building-your-application/deploying/static-exports

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next.js 14.2.x is not reliable on Node 23+; Netlify should use an LTS 20.x release.
  NODE_VERSION = "20"
