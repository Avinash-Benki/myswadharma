# Netlify runs the OpenNext adapter for Next.js automatically — no [[plugins]] needed.
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"

[build.environment]
  # Next.js 14.2.x is not reliable on Node 23+; Netlify should use an LTS 20.x release.
  NODE_VERSION = "20"
