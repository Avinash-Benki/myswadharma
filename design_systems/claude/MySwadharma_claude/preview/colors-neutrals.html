<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', sans-serif; background: #fffaf0; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .swatch { border-radius: 12px; overflow: hidden; border: 1px solid rgba(110,31,23,0.1); }
  .color { height: 72px; }
  .info { padding: 7px 8px; background: white; }
  .name { font-size: 10px; font-weight: 700; color: #3f100d; }
  .hex  { font-size: 9px; color: #75645d; margin-top: 1px; }
</style></head><body>
<div class="grid">
  <div class="swatch"><div class="color" style="background:#fffaf0"></div><div class="info"><div class="name">Ivory</div><div class="hex">#fffaf0</div></div></div>
  <div class="swatch"><div class="color" style="background:#fff4dc"></div><div class="info"><div class="name">Cream</div><div class="hex">#fff4dc</div></div></div>
  <div class="swatch"><div class="color" style="background:#f4dfb4"></div><div class="info"><div class="name">Sandal</div><div class="hex">#f4dfb4</div></div></div>
  <div class="swatch"><div class="color" style="background:#251813"></div><div class="info"><div class="name">Ink</div><div class="hex">#251813</div></div></div>
  <div class="swatch"><div class="color" style="background:#75645d"></div><div class="info"><div class="name">Muted</div><div class="hex">#75645d</div></div></div>
  <div class="swatch"><div class="color" style="background:#604942"></div><div class="info"><div class="name">Warm Mid</div><div class="hex">#604942</div></div></div>
</div>
</body></html>
