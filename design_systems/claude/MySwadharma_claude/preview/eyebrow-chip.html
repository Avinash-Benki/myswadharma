<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fffaf0; padding: 22px; font-family: 'Manrope', sans-serif; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: #9a4f05; background: rgba(217,133,24,0.12); border: 1px solid rgba(217,133,24,0.24); padding: 7px 13px; border-radius: 999px; font-weight: 800; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #d97706; box-shadow: 0 0 0 4px rgba(217,133,24,0.15); }
  .tag-maroon { background: rgba(110,31,23,0.1); color: #6e1f17; border: 1px solid rgba(110,31,23,0.2); padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .tag-leaf { background: rgba(47,93,70,0.1); color: #2f5d46; border: 1px solid rgba(47,93,70,0.2); padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; }
  .trust { background: rgba(255,255,255,0.6); border: 1px solid rgba(110,31,23,0.14); border-radius: 14px; padding: 10px 13px; font-size: 12px; color: #604942; font-weight: 750; }
</style></head><body>
  <span class="eyebrow"><span class="dot"></span>Trusted Hindu Platform</span>
  <span class="eyebrow"><span class="dot"></span>Shastra · Dharma · Karma · Daana</span>
  <span class="tag-maroon">Dharma</span>
  <span class="tag-maroon">Karma</span>
  <span class="tag-leaf">✓ Verified Pandit</span>
  <div class="trust">200+ Pandits</div>
  <div class="trust">50+ Rituals</div>
  <div class="trust">Authentic Vedic</div>
  <div class="trust">Trusted Community</div>
</body></html>
