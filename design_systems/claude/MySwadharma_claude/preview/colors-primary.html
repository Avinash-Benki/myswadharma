<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', sans-serif; background: #fffaf0; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .swatch { border-radius: 12px; overflow: hidden; }
  .color { height: 72px; }
  .info { padding: 7px 8px; background: white; }
  .name { font-size: 10px; font-weight: 700; color: #3f100d; }
  .hex  { font-size: 9px; color: #75645d; margin-top: 1px; }
</style></head><body>
<div class="grid">
  <div class="swatch"><div class="color" style="background:#d97706"></div><div class="info"><div class="name">Saffron</div><div class="hex">#d97706</div></div></div>
  <div class="swatch"><div class="color" style="background:#9a4f05"></div><div class="info"><div class="name">Deep Saffron</div><div class="hex">#9a4f05</div></div></div>
  <div class="swatch"><div class="color" style="background:#6e1f17"></div><div class="info"><div class="name">Maroon</div><div class="hex">#6e1f17</div></div></div>
  <div class="swatch"><div class="color" style="background:#3f100d"></div><div class="info"><div class="name">Maroon Dark</div><div class="hex">#3f100d</div></div></div>
  <div class="swatch"><div class="color" style="background:#d6a43b"></div><div class="info"><div class="name">Gold</div><div class="hex">#d6a43b</div></div></div>
  <div class="swatch"><div class="color" style="background:#a6632b"></div><div class="info"><div class="name">Copper</div><div class="hex">#a6632b</div></div></div>
  <div class="swatch"><div class="color" style="background:#2f5d46"></div><div class="info"><div class="name">Leaf</div><div class="hex">#2f5d46</div></div></div>
</div>
</body></html>
