<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Manrope:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0e8da; font-family: 'Manrope', sans-serif; }
  nav { background: rgba(255,250,240,0.92); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(110,31,23,0.16); }
  .inner { height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .mark { width: 36px; height: 36px; border-radius: 50%; background: conic-gradient(from 45deg, #d97706, #6e1f17, #d6a43b, #d97706); box-shadow: 0 6px 16px rgba(110,31,23,0.2); }
  .bname { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600; color: #3f100d; letter-spacing: 0.04em; text-transform: uppercase; }
  .bsub { font-size: 9px; color: #75645d; margin-top: 1px; }
  .links { display: flex; gap: 2px; }
  .links a { padding: 8px 13px; border-radius: 999px; color: #53352e; font-size: 13px; font-weight: 650; }
  .cta { padding: 10px 18px; border-radius: 999px; background: #d97706; color: #fffaf0; font-weight: 900; font-size: 13px; }
</style></head><body>
<nav><div class="inner">
  <div class="brand">
    <div class="mark"></div>
    <div><div class="bname">mySwadharma</div><div class="bsub">Shastra · Dharma · Karma · Daana</div></div>
  </div>
  <div class="links">
    <a href="#">Learn</a><a href="#">Rituals</a><a href="#">Pandits</a><a href="#">Daana</a><a href="#">Community</a>
  </div>
  <a class="cta" href="#">Begin Journey</a>
</div></nav>
</body></html>
