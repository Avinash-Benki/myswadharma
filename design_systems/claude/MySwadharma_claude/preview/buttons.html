<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fffaf0; padding: 24px; font-family: 'Manrope', sans-serif; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
  .primary { background: #d97706; color: #fffaf0; box-shadow: 0 12px 26px rgba(154,79,5,0.22); }
  .secondary { background: #fffaf0; color: #9a4f05; border-color: rgba(154,79,5,0.22); box-shadow: 0 8px 18px rgba(63,16,13,0.06); }
  .ghost { background: transparent; color: #6e1f17; border-color: rgba(110,31,23,0.24); }
  .maroon { background: #6e1f17; color: #fffaf0; box-shadow: 0 10px 22px rgba(63,16,13,0.2); }
  .sm { padding: 9px 16px; font-size: 12px; }
  .label { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #75645d; width: 100%; margin-top: 6px; }
</style></head><body>
  <button class="btn primary">Begin Your Journey</button>
  <button class="btn secondary">Explore Services</button>
  <button class="btn ghost">Learn More</button>
  <button class="btn maroon">Book a Pandit</button>
  <button class="btn primary sm">Book Now</button>
  <button class="btn secondary sm">View All</button>
</body></html>
