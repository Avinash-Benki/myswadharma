<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Fraunces:opsz,wght@9..144,650&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fffaf0; padding: 24px; font-family: 'Manrope', sans-serif; display: flex; gap: 20px; align-items: flex-start; }
  .card { background: white; border-radius: 18px; padding: 16px 20px; min-width: 140px; }
  .soft { box-shadow: 0 14px 35px rgba(63,16,13,0.08); }
  .card-shadow { box-shadow: 0 16px 38px rgba(63,16,13,0.07); border: 1px solid rgba(110,31,23,0.1); }
  .strong { box-shadow: 0 22px 55px rgba(63,16,13,0.13); }
  .btn-sh { box-shadow: 0 12px 26px rgba(154,79,5,0.18); }
  .title { font-family: 'Fraunces', serif; font-size: 13px; color: #3f100d; font-weight: 650; margin-bottom: 4px; }
  .sub { font-size: 9px; color: #75645d; }
</style></head><body>
  <div class="card soft"><div class="title">Soft</div><div class="sub">0 14px 35px / 8%</div></div>
  <div class="card card-shadow"><div class="title">Card</div><div class="sub">0 16px 38px / 7%</div></div>
  <div class="card strong"><div class="title">Strong</div><div class="sub">0 22px 55px / 13%</div></div>
  <div class="card btn-sh" style="background:#d97706"><div class="title" style="color:white">Button</div><div class="sub" style="color:rgba(255,255,255,0.7)">0 12px 26px / 18%</div></div>
</body></html>
